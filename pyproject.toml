[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "webcrawler"
version = "0.1.0"
description = "A small, polite, HTML-focused web crawler."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "requests>=2.28",
    "beautifulsoup4>=4.11",
    "lxml>=4.9",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
webcrawler = "webcrawler.cli:main"

[tool.setuptools.packages.find]
include = ["webcrawler*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
